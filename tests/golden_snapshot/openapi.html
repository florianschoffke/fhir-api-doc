<!DOCTYPE html><html lang="en"><head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="/favicon.png" sizes="any" type="image/png">
        <title>FHIR Library Test</title>
        <link href="/ig.gematik.css" rel="stylesheet">
        <script src="/ig.gematik.min.js"></script>
        <link href="/ig.req.gematik.css" rel="stylesheet">
        <script src="/ig.req.gematik.min.js"></script>
        <link href="/edge-dark.min.css" rel="stylesheet">
        <script src="/ig.api.doc.gematik.min.js"></script>
        <script src="/ig.openapi.gematik.min.js"></script>
    <style>:root {
    --fhir-api-doc-get-color: 124, 188, 207;
    --fhir-api-doc-post-color: 63, 171, 153;
    --fhir-api-doc-put-color: 231, 181, 119;
    --fhir-api-doc-delete-color: 231, 158, 158;
    --fhir-api-doc-head-color: 182, 163, 198; 
    --fhir-api-doc-patch-color: 145, 166, 188;
}

textarea[data-apidoc-data="yaml"] {
    display: none;
}

.gem-ig-api-doc {
    font-family: sans-serif;
    font-size: 12px;
}


.gem-ig-api-doc a {
    color: #000;
    border-bottom: 1px dashed rgba(0, 0, 0, 0.2);
    padding-bottom: 2px;
    text-decoration: none;
}

.gem-ig-api-doc a:hover {
    color: #0d7395;
}

.gem-ig-api-doc a:active {
    color: #000;
}

.gem-ig-api-doc p {
    padding: 0px;
}

.gem-ig-api-doc th {
    text-align: left;
    font-weight:bold;
    padding-right: 10px;
    padding-left: 5px;
}

.gem-ig-api-doc .operation-block {
    border: 1px solid #000;
    border-radius: 2px;
    margin: 0 0 15px;
}

.gem-ig-api-doc .operation-block-summary {
    all: inherit;
    border: 0;
    cursor:default;
    flex: 1;
    padding: 0;
    margin: 0;
    align-items: center;
    display: flex;
    box-shadow: 0 0 3px rgba(0, 0, 0, .19);
    border-bottom-left-radius: 0%;
    border-bottom-right-radius: 0%;
}

.operation-block-summary-control {
    display: flex;
}

.gem-ig-api-doc .operation-block-summary-method {
    border-radius: 2px;
    color: #fff;
    font-family: sans-serif;
    font-size: 12px;
    font-weight: 700;
    min-width: 60px;
    padding: 6px 0;
    margin: 5px;
    text-align: center;
    border-style: none;
}

.gem-ig-api-doc .operation-block-summary-path {
    align-items: center;
    color: #3b4151;
    display: flex;
    font-family: monospace;
    font-size: 14px;
    font-weight: 600;
    word-break: break-word;
}

.gem-ig-api-doc .operation-block-description {
    padding: 10px 20px 10px 20px;
}

.gem-ig-api-doc .operation-block-description.low-padding {
    padding: 0px;
    padding-bottom: 10px;
    padding-left: 20px;
}

.gem-ig-api-doc .operation-block-description.with-table {
    overflow: scroll;
}

.gem-ig-api-doc .operation-block-description.operation-example {
    padding: 0px 20px;
}

.gem-ig-api-doc .operation-block-section-header {
    background-color: #ffffff;
    padding: 10px 20px;
    font-weight: bold;
}

.gem-ig-api-doc .example {
    border-radius: 2px;
    background-color: #ffffff;
    font-family: sans-serif;
    font-size: 12px;
    font-weight: 700;
    min-width: 60px;
    padding: 0px 10px 0px 0px;
    text-align: left;
    border: 1px solid;
    border-color: #519ad9;
    height: 30px;
    cursor: pointer;
    margin-bottom: 5px;
    max-width: 400px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

}

.gem-ig-api-doc .example .label {
    border-radius: 2px 0 0 2px;
    background-color: #519ad9;
    color: #fff;
    padding: 8px;
    margin-right: 10px;
    min-width: 60px;
    font-size: 100%;
}

.gem-ig-api-doc .inline-button {
    display: inline-block;
    margin-right: 10px;
}

.gem-ig-api-doc button:hover, .gem-ig-api-doc .active-button {
    opacity: 0.5;
}

.gem-ig-api-doc .example-buttons-container{
    padding: 3px;
    text-align: right;
}

.gem-ig-api-doc table {
    max-width: 100%;
}

.gem-ig-api-doc table.params-table tr th:nth-child(1) {
    width: 240px;
}

.gem-ig-api-doc table.params-table tr th:nth-child(2) {
    width: 120px;
}

.gem-ig-api-doc table.params-table tr th:nth-child(3) {
    width: 680px;
}

.gem-ig-api-doc table tr td {
    border-bottom: 1px solid rgba(192, 192, 192, 0.2);
    border-spacing: 0;
}

.gem-ig-api-doc table tr:last-child td {
    border-bottom: none;
}

.gem-ig-api-doc table tr:nth-child(even) {
    background: #eeeeee89;
}

.gem-ig-api-doc table tr:nth-child(odd) {
    background: #ffffff89;
}

.gem-ig-api-doc table th {
    background: rgba(var(--fhir-api-doc-color), 0.2);
}

.operation-block-description > pre {
    background-color: #171c19;
    color: #fff;
    padding: 10px;
}

.gem-ig-api-doc .operation-example > pre {
    background-color: #171c19;
    color: #fff;
    overflow: auto;
    white-space: pre;
    padding: 10px;
}

.gem-ig-api-doc code {
    color: inherit;
}

.gem-ig-api-doc .operation-example > pre > .html-example {
    overflow: auto;
    padding: 10px;
    color: black;
    background: white;

}

/* Common styles for operation-block by method */
.gem-ig-api-doc .operation-block[class*="operation-block-"] {
    border-color: rgba(var(--fhir-api-doc-color), 1.0);
    background-color: rgba(var(--fhir-api-doc-color), 0.1);
}

.gem-ig-api-doc .operation-block-summary-method[class*="operation-block-"] {
    background-color: rgba(var(--fhir-api-doc-color), 1.0);
}

.gem-ig-api-doc .operation-block[class*="operation-block-"] .example {
    border-color: rgba(var(--fhir-api-doc-color), 1.0);
}

.gem-ig-api-doc .operation-block[class*="operation-block-"] .example .label {
    background-color: rgba(var(--fhir-api-doc-color), 1.0);
}


/* Specific method colors */
.gem-ig-api-doc .operation-block-get {
    --fhir-api-doc-color: var(--fhir-api-doc-get-color);
}

.gem-ig-api-doc .operation-block-post {
    --fhir-api-doc-color: var(--fhir-api-doc-post-color);
}

.gem-ig-api-doc .operation-block-put {
    --fhir-api-doc-color: var(--fhir-api-doc-put-color);
}

.gem-ig-api-doc .operation-block-delete {
    --fhir-api-doc-color: var(--fhir-api-doc-delete-color);
}

.gem-ig-api-doc .operation-block-head {
    --fhir-api-doc-color: var(--fhir-api-doc-head-color);
}

.gem-ig-api-doc .operation-block-patch {
    --fhir-api-doc-color: var(--fhir-api-doc-patch-color);
}

.gem-ig-copy-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 5px;
}

/* Sprachangabe links */
.gem-id-code-lang {
    text-align: left;
    font-size: 13px;
    font-family: 'Courier New', Courier, monospace;
    background-color: rgba(255, 255, 255, 0.187);
    /* background-color: rgb(110, 110, 110); */
    color: #fff;
}

.operation-block .gem-id-code-lang {
    margin-left: -10px;
    margin-top: -20px;
    border-bottom-right-radius: 30%;
    padding: 6px;
}

/* Kopierbutton rechts */
.gem-ig-copy-button-wrapper {
    text-align: right;
}

.gem-ig-copy-button-wrapper button {
    cursor: pointer;
    border: #fff solid 1px;
    background-color: rgba(0, 0, 0, 0.3);
    color: #fff;
    padding: 5px;
    font-size: 12px;
}
